name: Build Post Office Directory APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sri_Lanka_Post_Office_Directory_Android_Studio_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android project
        run: |
          unzip -q Sri_Lanka_Post_Office_Directory_Android_Studio_Project.zip -d project-source
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project-source/PostOfficeDirectoryAndroid" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Post-Office-Directory-debug-APK
          path: project-source/PostOfficeDirectoryAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
