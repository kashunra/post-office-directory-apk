function envelope(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>'}
function renderNav(){nav.innerHTML='';alphabet.forEach(l=>{let b=document.createElement('button');b.className='letter'+(!query&&l===active?' active':'');b.textContent=l;b.onclick=()=>{query='';search.value='';active=l;renderNav();render()};nav.appendChild(b)})}
function render(){let filtered=DATA.filter(x=>query?(x.name.toLowerCase().includes(query.toLowerCase())||x.code.includes(query)):x.name[0]?.toUpperCase()===active);document.getElementById('count').textContent=query?`${filtered.length.toLocaleString()} results`:`${filtered.length.toLocaleString()} entries beginning with ${active}`;if(!filtered.length){list.innerHTML='<div class="empty">No post office found.<br>Try another name or postal code.</div>';return}list.innerHTML=filtered.map((x,i)=>`<button class="item" data-i="${i}"><span class="icon">${envelope()}</span><span class="info"><span class="name">${escapeHtml(x.name.replace(/\([^)]*\)/g,'' ).trim())}</span><span class="code">${x.code}</span></span>${x.name.match(/\(([A-Z]{2,6})\)/)?`<span class="badge">${x.name.match(/\(([A-Z]{2,6})\)/)[1]}</span>`:''}</button>`).join('');[...list.querySelectorAll('.item')].forEach((el,i)=>el.onclick=()=>detail(filtered[i]))}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function detail(x){document.getElementById('dname').textContent=x.name;document.getElementById('dcode').textContent=x.code;document.getElementById('detailbg').classList.add('open');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(x.code);document.getElementById('copy').textContent='Copied!'}catch(e){prompt('Copy postal code:',x.code)}}}
search.addEventListener('input',()=>{query=search.value.trim();renderNav();render()});document.getElementById('fab').onclick=()=>{let box=document.getElementById('searchbox');box.classList.toggle('show');if(box.classList.contains('show'))search.focus();else{query='';search.value='';renderNav();render()}};document.getElementById('menu').onclick=()=>document.getElementById('drawer').classList.add('open');document.getElementById('drawerclose').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};document.getElementById('all').onclick=()=>{active='';query=' ';search.value='';document.getElementById('searchbox').classList.add('show');query='';search.value='';list.innerHTML='';document.getElementById('count').textContent=`${DATA.length.toLocaleString()} total directory entries`;list.innerHTML=DATA.map(x=>`<button class="item" data-code="${x.code}" data-name="${escapeHtml(x.name)}"><span class="icon">${envelope()}</span><span class="info"><span class="name">${escapeHtml(x.name.replace(/\([^)]*\)/g,'').trim())}</span><span class="code">${x.code}</span></span></button>`).join('');list.querySelectorAll('.item').forEach(el=>el.onclick=()=>detail({name:el.dataset.name,code:el.dataset.code}));document.getElementById('drawer').classList.remove('open');nav.querySelectorAll('.letter').forEach(b=>b.classList.remove('active'))};document.getElementById('about').onclick=()=>{document.getElementById('drawer').classList.remove('open');alert('Sri Lanka Post Office Directory\n\nThis offline directory was built from the 55-page Postal Code Directory PDF you uploaded. Search by post office name or postal code.\n\nSome entries may reflect text-extraction/OCR formatting from the scanned PDF.')};document.getElementById('close').onclick=()=>document.getElementById('detailbg').classList.remove('open');document.getElementById('detailbg').onclick=e=>{if(e.target.id==='detailbg')e.currentTarget.classList.remove('open')};renderNav();render();
